# Weekly proposal of crew updates as a pull request.
# A pull request opened with the workflow token does not trigger other workflows, so required checks may
# need a manual re-run, or a token with more rights in place of github.token.
# The workflow token cannot push changes to .github/workflows, so an update that touches a workflow file
# fails to push. The repository setting "Allow GitHub Actions to create and approve pull requests" must be on
# (Settings, Actions, General) or the pull request cannot be opened.
name: crew-update

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: crew-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Set the git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Propose the crew update
        env:
          GH_TOKEN: ${{ github.token }}
        run: .claude/hooks/crew/crew-update.sh
